[workspace]
resolver = "2"
members = [
  "crates/nono-core",
  "crates/nono-render",
  "crates/nono-platform",
  "crates/nono-app",
  "crates/nono-plugin",
  "crates/nono-agent",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
nono-core = { path = "crates/nono-core" }
nono-render = { path = "crates/nono-render" }
nono-platform = { path = "crates/nono-platform" }
nono-plugin = { path = "crates/nono-plugin" }
nono-agent = { path = "crates/nono-agent" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep dev builds quick but still debuggable.
[profile.dev]
debug = 1
