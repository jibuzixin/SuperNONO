<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NONO 调色部件标注</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside>
  <h1>调色部件标注</h1>
  <p class="hint">点击动画里<b>需要染色</b>的部件，会把该部件对应的 Lottie 图层加入列表；一个部件可能由多层组成，多点几处即可。<br>
  不要点：小手/鳍、耳朵白光、汗滴、气泡、灯泡、魔方、面罩里的眼睛高光。</p>
  <div id="list"></div>
</aside>
<main>
  <div class="toolbar">
    <span id="title">选择左侧动画</span>
    <span class="spacer"></span>
    <button id="modeParts" class="active">部件</button>
    <button id="modeBrush">画笔遮罩</button>
    <label id="brushWrap" hidden>笔刷 <input id="brush" type="range" min="2" max="30" value="10"><span id="brushVal">10</span></label>
    <button id="clear">清空</button>
    <button id="save">保存部件</button>
    <button id="saveMask" hidden>保存遮罩</button>
    <span id="status"></span>
  </div>
  <div class="toolbar">
    <button id="prev">◀</button>
    <input id="frame" type="range" min="0" max="0" value="0" style="flex:1">
    <button id="next">▶</button>
    <span id="frameLabel">0 / 0</span>
  </div>
  <div class="stage">
    <canvas id="view" width="231" height="240"></canvas>
  </div>
  <div class="selected" id="selectedWrap">
    <h2>已选部件 <span id="count">0</span></h2>
    <div id="selected"></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
